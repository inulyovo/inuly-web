<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入</title>
    <link rel="stylesheet" href="./css/Loading.css">
    <link rel="stylesheet" href="./css/login.css">
    <style>
        /* ===== 基礎重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 背景故障效果 ===== */
        .back.fault-active::before,
        .back.fault-active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: inherit;
            background-size: 110% 110%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.6;
            z-index: -1;
        }

        .back.fault-active::after {
            transform: translateX(var(--offset-red, 2px));
            filter: grayscale(100%) sepia(1) saturate(600%) hue-rotate(0deg) brightness(0.4);
        }

        .back.fault-active::before {
            transform: translateX(var(--offset-green, -2px));
            filter: grayscale(100%) sepia(1) saturate(600%) hue-rotate(90deg) brightness(0.4);
        }

        /* ===== VHS 掃描線層 ===== */
        .vhs-scan-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0) 50%,
                    rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 5;
            display: none;
            opacity: 0.7;
        }

        .vhs-scan-lines.active {
            display: block;
        }

        /* ===== 四層 LOGIN 文字容器 ===== */
        .logtitle-container {
            position: relative;
            height: 125px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            margin-bottom: 20px;
            z-index: 6;
        }

        /* ===== 單層 LOGIN 樣式 ===== */
        .logtitle-layer {
            position: absolute;
            font-size: 50px;
            font-weight: bolder;
            -webkit-background-clip: text;
            background-image: linear-gradient(90deg, rgba(98, 201, 248, 0.6), rgba(243, 111, 255, 0.6), rgba(247, 129, 129, 0.6), rgba(241, 239, 104, 0.6), rgba(117, 226, 84, 0.6), rgba(98, 201, 248, 0.6));
            background-size: 800%;
            animation: gradient 30s infinite linear;
            color: transparent;
            white-space: nowrap;
            transition: none !important;
            user-select: none;
        }

        body.show-password .logtitle-layer {
            background-image: linear-gradient(90deg, rgba(150, 220, 255, 0.8), rgba(255, 180, 255, 0.8), rgba(255, 180, 180, 0.8), rgba(255, 255, 180, 0.8), rgba(180, 255, 180, 0.8), rgba(150, 220, 255, 0.8));
        }

        /* ===== 文字故障效果 ===== */
        .logtitle-layer.faulttext_fault {
            animation: none !important;
        }

        .logtitle-layer.faulttext_fault::after,
        .logtitle-layer.faulttext_fault::before {
            content: "LOGIN";
            position: absolute;
            left: 0;
            top: 0;
            font-family: Impact, sans-serif;
            font-size: 50px;
            font-weight: bolder;
            letter-spacing: 0.5rem;
            mix-blend-mode: screen;
            z-index: 10;
        }

        .logtitle-layer.faulttext_fault::after {
            color: #ff0000;
            transform: translateX(2%);
        }

        .logtitle-layer.faulttext_fault::before {
            color: #0000ff;
            transform: translateX(-2%);
        }

        /* ===== 表單切換動畫 ===== */
        .logbody {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .logbody.fade-out {
            opacity: 0;
            transform: translateX(-20px);
        }

        .logbody.fade-in {
            opacity: 1;
            transform: translateX(0);
        }



        /* 再次確認父層設定，確保它們被置中 */
        .form-footer {
            display: flex;
            justify-content: center;
            /* 讓兩個按鈕置中 */
            align-items: center;
            gap: 30px;
            /* 兩個按鈕中間的距離 */
            margin-top: 40px;
            /* 與上方「登入」大按鈕的距離 */
            width: 100%;
        }




        #beam,
        #beamReg {
            pointer-events: none;
        }

        #beamReg {
            transform: rotate(var(--beamDegreesReg));
        }

        #toggleLogin {
            margin-left: -20px;
            /* 負值會讓它往左移 */
        }
    </style>
</head>

<body>
    <!-- 載入動畫 -->
    <div class="con" id="con">
        <div class="load">
            <div class="dot" style="--i:0"></div>
            <div class="dot" style="--i:1"></div>
            <div class="dot" style="--i:2"></div>
            <div class="dot" style="--i:3"></div>
            <div class="dot" style="--i:4"></div>
            <div class="dot" style="--i:5"></div>
            <div class="dot" style="--i:6"></div>
        </div>
    </div>

    <!-- 背景層 -->
    <div class="back" id="back">
        <!-- 掃描線層 -->
        <div class="vhs-scan-lines" id="scanLines"></div>

        <!-- 表單容器 -->
        <div class="log" id="log">
            <!-- 標題 -->
            <div class="logtitle-container">
                <div class="logtitle-layer">LOGIN</div>
                <div class="logtitle-layer">LOGIN</div>
                <div class="logtitle-layer">LOGIN</div>
                <div class="logtitle-layer">LOGIN</div>
            </div>

            <!-- 登入表單 -->
            <form id="loginForm" class="logbody">
                <div class="input-container">
                    <input type="text" id="zh" size="20" class="txt" placeholder="帳號" autocomplete="username">
                </div>
                <div class="input-container password-container">
                    <input type="password" id="mm" size="20" class="txt" placeholder="密碼"
                        autocomplete="current-password">
                    <button type="button" id="eyeball" class="eyeball-btn" aria-label="Toggle password visibility">
                        <div class="eye"></div>
                    </button>
                    <div id="beam"></div>
                </div>
                <input type="submit" value="登入" id="sub" class="sub">

                <!-- 底部按鈕 -->
                <div class="form-footer">
                    <a href="./me.html"><input type="button" value="訪客登入" id="ykbt" class="ykbt"></a>
                    <input type="button" value="帳號註冊" id="toggleRegister" class="ykbt">
                </div>
            </form>

            <!-- 註冊表單 (預設隱藏) -->
            <form id="registerForm" class="logbody" style="display: none;">
                <div class="input-container">
                    <input type="text" id="regUsername" size="20" class="txt" placeholder="帳號" autocomplete="username"
                        required minlength="3">
                </div>
                <div class="input-container">
                    <input type="email" id="regEmail" size="20" class="txt" placeholder="Email（選填）"
                        autocomplete="email">
                </div>
                <div class="input-container password-container">
                    <input type="password" id="regPassword" size="20" class="txt" placeholder="密碼"
                        autocomplete="new-password" required minlength="6">
                    <button type="button" id="eyeballReg" class="eyeball-btn" aria-label="Toggle password visibility">
                        <div class="eye"></div>
                    </button>
                    <div id="beamReg"></div>
                </div>
                <div class="input-container password-container">
                    <input type="password" id="regConfirm" size="20" class="txt" placeholder="確認密碼"
                        autocomplete="new-password" required minlength="6">
                </div>
                <input type="submit" value="註冊" id="regSub" class="sub">

                <!-- 返回按鈕 -->
                <input type="button" value="返回登入" id="toggleLogin" class="ykbt">
            </form>
        </div>
    </div>

    <script src="./js/login.js"></script>

    <!-- ===== 故障效果核心 JS ===== -->
    <script>
        // ===== 背景故障模組 =====
        const bgModule = {
            bg: document.getElementById('back'),
            scanLines: document.getElementById('scanLines'),
            isFaulting: false,

            init() { },

            startFault() {
                if (this.isFaulting) return;
                this.isFaulting = true;

                const offsetRed = (Math.random() * 8 - 4).toFixed(1);
                const offsetGreen = (Math.random() * 8 - 4).toFixed(1);

                this.bg.style.setProperty('--offset-red', `${offsetRed}px`);
                this.bg.style.setProperty('--offset-green', `${offsetGreen}px`);

                this.bg.classList.add('fault-active');
                this.scanLines.classList.add('active');
            },

            endFault() {
                this.bg.classList.remove('fault-active');
                this.scanLines.classList.remove('active');
                this.isFaulting = false;
            }
        };

        // ===== 文字故障模組 =====
        const textModule = {
            player: null,
            texts: [],
            isAnimating: false,

            init() {
                this.texts = [...document.querySelectorAll('.logtitle-layer')];
            },

            startFault() {
                if (this.isAnimating) return;
                this.isAnimating = true;

                clearInterval(this.player);
                this.texts.forEach(text => {
                    text.classList.add("faulttext_fault");
                });

                this.player = setInterval(() => {
                    this.texts.forEach(text => {
                        text.style.transform = `translate(${Math.random() * 15 - 7.5}%, ${Math.random() * 15 - 7.5}%)`;

                        let x = Math.random() * 100;
                        let y = Math.random() * 100;
                        let h = Math.random() * 40 + 30;
                        let w = Math.random() * 30 + 20;
                        text.style.clipPath = `polygon(${x}% ${y}%, ${x + w}% ${y}%, ${x + w}% ${y + h}%, ${x}% ${y + h}%)`;
                    });
                }, 30);
            },

            endFault() {
                clearInterval(this.player);
                this.texts.forEach(text => {
                    text.classList.remove("faulttext_fault");
                    text.style.transform = '';
                    text.style.clipPath = '';
                });
                this.isAnimating = false;
            }
        };

        // ===== 統一共振器 =====
        const synchronizer = {
            isFaulting: false,
            isPasswordVisible: false,
            randomFaultTimer: null,

            init() {
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach(mutation => {
                        if (mutation.attributeName === 'class') {
                            const newIsPasswordVisible = document.body.classList.contains('show-password');

                            if (newIsPasswordVisible !== this.isPasswordVisible) {
                                this.isPasswordVisible = newIsPasswordVisible;

                                if (this.isPasswordVisible) {
                                    if (this.isFaulting) this.endFault();
                                    this.stopRandomFault();
                                } else {
                                    this.startRandomFault();
                                }
                            }
                        }
                    });
                });
                observer.observe(document.body, { attributes: true });

                window.addEventListener('load', () => {
                    setTimeout(() => {
                        this.isPasswordVisible = document.body.classList.contains('show-password');
                        if (!this.isPasswordVisible) {
                            this.startRandomFault();
                        }
                    }, 1000);
                });
            },

            triggerFault() {
                if (this.isPasswordVisible || this.isFaulting) return;
                this.isFaulting = true;

                bgModule.startFault();
                textModule.startFault();

                setTimeout(() => {
                    bgModule.endFault();
                    textModule.endFault();
                    this.isFaulting = false;
                }, 800);
            },

            startRandomFault() {
                this.stopRandomFault();

                if (this.isPasswordVisible) return;

                const trigger = () => {
                    const delay = Math.floor(Math.random() * 5000) + 2000;
                    this.randomFaultTimer = setTimeout(() => {
                        if (!this.isPasswordVisible && !this.isFaulting) {
                            this.triggerFault();
                        }
                        trigger();
                    }, delay);
                };
                trigger();
            },

            stopRandomFault() {
                if (this.randomFaultTimer) {
                    clearTimeout(this.randomFaultTimer);
                    this.randomFaultTimer = null;
                }
            },

            endFault() {
                bgModule.endFault();
                textModule.endFault();
                this.isFaulting = false;
            }
        };

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            bgModule.init();
            textModule.init();
            synchronizer.init();

            const toggleRegister = document.getElementById('toggleRegister');
            const toggleLogin = document.getElementById('toggleLogin');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const titleLayers = document.querySelectorAll('.logtitle-layer');

            // ===== 切換到註冊模式 =====
            if (toggleRegister) {
                toggleRegister.addEventListener('click', () => {
                    document.body.classList.remove('show-password');
                    loginForm.classList.remove('fade-in', 'fade-out');
                    registerForm.classList.remove('fade-in', 'fade-out');

                    loginForm.classList.add('fade-out');

                    setTimeout(() => {
                        loginForm.style.display = 'none';
                        registerForm.style.display = 'block';

                        // 更新標題
                        titleLayers.forEach(layer => {
                            layer.textContent = 'REGISTER';
                            layer.classList.remove('faulttext_fault');
                            layer.style.transform = '';
                            layer.style.clipPath = '';
                        });

                        // 🔧 確保註冊表單從透明變不透明
                        registerForm.classList.remove('fade-out');
                        registerForm.classList.add('fade-in');
                        setTimeout(() => {
                            registerForm.classList.remove('fade-in');
                        }, 300);
                    }, 300);
                });
            }

            // ===== 切換回登入模式 =====
            if (toggleLogin) {
                toggleLogin.addEventListener('click', () => {
                    document.body.classList.remove('show-password');
                    loginForm.classList.remove('fade-in', 'fade-out');
                    registerForm.classList.remove('fade-in', 'fade-out');

                    registerForm.classList.add('fade-out');

                    setTimeout(() => {
                        registerForm.style.display = 'none';
                        loginForm.style.display = 'block';

                        // 更新標題
                        titleLayers.forEach(layer => {
                            layer.textContent = 'LOGIN';
                            layer.classList.remove('faulttext_fault');
                            layer.style.transform = '';
                            layer.style.clipPath = '';
                        });

                        // 🔧 確保登入表單從透明變不透明
                        loginForm.classList.remove('fade-out');
                        loginForm.classList.add('fade-in');
                        setTimeout(() => {
                            loginForm.classList.remove('fade-in');
                        }, 300);
                    }, 300);
                });
            }




            // ===== 註冊表單的眼睛按鈕（統一控制兩欄）=====
            const eyeballReg = document.getElementById('eyeballReg');
            const beamReg = document.getElementById('beamReg');
            const regPass1 = document.getElementById('regPassword');
            const regPass2 = document.getElementById('regConfirm');
            const regContainer = registerForm.querySelector('.password-container');

            if (eyeballReg && regPass1 && regPass2) {
                function adjustRegEyePosition() {
                    if (!regContainer) return;

                    const rect = regPass1.getBoundingClientRect();
                    const containerRect = regContainer.getBoundingClientRect();
                    const rightPos = containerRect.right - rect.right + 15;

                    eyeballReg.style.right = Math.max(10, rightPos) + 'px';
                }

                window.addEventListener('resize', adjustRegEyePosition);
                adjustRegEyePosition();

                eyeballReg.addEventListener('click', function (e) {

                    if (registerForm.style.display === 'none') return;

                    e.preventDefault();

                    const isPassword = regPass1.type === 'password';
                    regPass1.type = isPassword ? 'text' : 'password';
                    regPass2.type = isPassword ? 'text' : 'password';

                    document.body.classList.toggle('show-password', isPassword);

                    if (typeof synchronizer !== 'undefined') {
                        if (isPassword) {
                            synchronizer.stopRandomFault();
                        } else {
                            synchronizer.startRandomFault();
                        }
                    }

                    adjustRegEyePosition();
                });
            }

            // ===== 註冊表單的光束追蹤 =====
            document.documentElement.addEventListener('mousemove', function (e) {
                if (!beamReg || !document.body.classList.contains('show-password')) return;
                // 只在註冊表單顯示時追蹤
                if (registerForm.style.display === 'none') return;

                const rect = beamReg.getBoundingClientRect();
                const mouseX = rect.right + (rect.width / 2);
                const mouseY = rect.top + (rect.height / 2);

                const rad = Math.atan2(mouseX - e.pageX, mouseY - e.pageY);
                const degrees = (rad * (20 / Math.PI) * -1) - 350;

                document.documentElement.style.setProperty('--beamDegreesReg', `${degrees}deg`);
            });
        });

        // ===== 註冊主函數 =====


        // ===== 輔助函數 =====
        function showFeedback(message, type = 'info') {
            console.log(`[${type}] ${message}`);
            if (type === 'error') {
                alert('❌ ' + message);
            } else if (type === 'success') {
                alert('✅ ' + message);
            }
        }

        function triggerFaultEffect() {
            if (typeof synchronizer !== 'undefined' && !synchronizer.isFaulting) {
                synchronizer.triggerFault();
            }
        }
    </script>
</body>

</html>
